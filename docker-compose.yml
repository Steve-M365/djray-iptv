services:
  web:
    build: .
    container_name: djray-iptv
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - FLASK_DEBUG=false
    volumes:
      - ./output:/app/output:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  scheduler:
    build: .
    container_name: djray-iptv-build
    command: ["sh", "-c", "while true; do python build.py || true; sleep 86400; done"]
    volumes:
      - ./output:/app/output
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true